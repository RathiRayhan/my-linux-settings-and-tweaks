save-position-on-quit=yes

# =========================================================
# Final Clean & Sharp Subtitle Configuration (VLC-like)
# =========================================================

# ---------------------------------------------------------
# Subtitle Font & Styling
# Forces custom styling instead of embedded subtitle styles
# ---------------------------------------------------------
sub-ass-override=force
sub-font='Kalpurush'
sub-font-size=50
sub-scale-with-window=yes

# ---------------------------------------------------------
# Subtitle Colors & Border
# White text with a thin black outline for sharp readability
# ---------------------------------------------------------
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-border-size=1.5

# ---------------------------------------------------------
# Shadow & Blur Settings
# Completely disables shadow and blur for crisp subtitles
# ---------------------------------------------------------
sub-shadow-offset=0
sub-shadow-color='#00000000'
sub-blur=0

# ---------------------------------------------------------
# Subtitle Blending
# Keeps subtitles on a separate layer from the video
# ---------------------------------------------------------
blend-subtitles=no

# =========================================================
# Audio & Language Preferences
# =========================================================

# Prefer English audio first, then Bengali
alang=en,eng,ben,bn

# Prefer Bengali subtitles first, then English
slang=ben,bn,en,eng

# Prevent volume from exceeding 100%
volume-max=100

profile=pseudo-gui
idle=yes
